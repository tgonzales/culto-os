<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>cultoOS - Carregando</title>

        <link rel="stylesheet" href="global.css" />

        <style>
            :root {
                --radius: 5px;
                --loader-height: 3px;
            }

            main {
                background-color: #2b2724;
                background: linear-gradient(140deg, #37322e 10%, #191714);
                width: 100%;
                height: 100%;
                border-radius: var(--radius);

                display: flex;
                flex-direction: column;
                gap: 14px;
                justify-content: center;
                align-items: center;
                -webkit-app-region: drag;

                overflow: hidden;
            }

            img {
                width: 96px;
                height: 96px;
                border-radius: 22px;
                box-shadow: 0 10px 30px rgb(0 0 0 / 0.35);
            }

            .text {
                text-align: center;
            }

            .v {
                opacity: 0.4;
                font-size: 0.9em;
                margin-top: 4px;
            }

            h1 {
                font-size: 2.6em;
                background: -webkit-linear-gradient(340deg, #d6bc9c, #b08968);
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .loader {
                --margin: 1.5px; /* calc(var(--radius) / 2); */
                background-color: var(--primary-lighter);
                margin: 0 var(--margin);
                border-top-left-radius: 40px;
                border-top-right-radius: 40px;

                position: absolute;
                top: 0;
                width: calc(100% - (var(--margin) * 2));
                height: var(--loader-height);

                overflow: hidden;
            }

            .loader span:before {
                content: "";
                position: absolute;
                height: 100%;
                background-color: var(--secondary);
                animation: first 1.8s infinite ease-out;
            }

            .loader span:after {
                content: "";
                position: absolute;
                height: 100%;
                background-color: var(--secondary);
                animation: second 1.8s infinite ease-in;
            }

            @keyframes first {
                0% {
                    inset-inline-start: -100%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }

            @keyframes second {
                0% {
                    inset-inline-start: -150%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }
        </style>
    </head>
    <body>
        <div class="loader">
            <span></span>
        </div>

        <main>
            <img src="./brand-logo.png" alt="cultoOS" draggable="false" />

            <div class="text">
                <h1>cultoOS</h1>
                <p class="v">v<span class="version">0.0.0</span></p>
            </div>
        </main>

        <script>
            const { ipcRenderer } = require("electron")

            ipcRenderer.send("MAIN", { channel: "VERSION" })
            ipcRenderer.once("MAIN", (e, msg) => {
                if (msg.channel !== "VERSION" || !msg.data) return
                document.querySelector(".version").innerHTML = msg.data
            })
        </script>
    </body>
</html>
