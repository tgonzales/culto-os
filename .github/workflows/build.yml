name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # unsigned NSIS installer (no publish); code signing comes later
      - name: Package installer
        run: npx electron-builder --config config/building/electron-builder.yaml --win nsis --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CultoOS-windows
          path: dist/*.exe
          if-no-files-found: error
