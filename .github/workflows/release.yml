name: Release (Windows installer)
# Push a tag like v0.1.0 to build the Windows installer and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # unsigned NSIS installer published to the GitHub Release of the tag (code signing comes later).
      # The target comes from win.target in the config; repeating it here ("--win nsis") publishes twice.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config config/building/electron-builder.yaml --win --publish always
